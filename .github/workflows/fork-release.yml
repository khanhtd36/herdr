name: Fork release

on:
  push:
    tags:
      - "fork-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#fork-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Rename binary
        run: cp target/x86_64-unknown-linux-musl/release/herdr herdr-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-linux-x86_64
          path: herdr-linux-x86_64

  build-macos:
    needs: verify-version
    runs-on: macos-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore Homebrew Zig cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.16-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.16-${{ runner.os }}-

      - name: Install patched Zig on macOS
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.16
          echo "$(brew --prefix zig@0.16)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.16)/bin/zig" version

      - name: Install macOS build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build (aarch64)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build (x86_64, cross-compiled)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Rename binaries
        run: |
          cp target/aarch64-apple-darwin/release/herdr herdr-macos-aarch64
          cp target/x86_64-apple-darwin/release/herdr herdr-macos-x86_64

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-macos-aarch64
          path: herdr-macos-aarch64

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-macos-x86_64
          path: herdr-macos-x86_64

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Rename binary
        shell: pwsh
        run: Copy-Item target\x86_64-pc-windows-msvc\release\herdr.exe herdr-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-windows-x86_64
          path: herdr-windows-x86_64.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ github.ref_name }}
      windows_asset_url: ${{ steps.urls.outputs.windows_asset_url }}
      macos_aarch64_sha256: ${{ steps.shas.outputs.macos_aarch64_sha256 }}
      macos_x86_64_sha256: ${{ steps.shas.outputs.macos_x86_64_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Needed so the "Update latest.json manifest" step below can push
          # the regenerated manifest back to master.
          persist-credentials: true

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#fork-v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          name: herdr-khanhtd36 ${{ steps.version.outputs.version }}
          body: |
            Unofficial fork of [herdr](https://github.com/ogulcancelik/herdr) built by khanhtd36.
            Not affiliated with the original project.
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-windows-x86_64/herdr-windows-x86_64.exe

      - name: Resolve asset URLs
        id: urls
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "windows_asset_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/herdr-windows-x86_64.exe" >> "$GITHUB_OUTPUT"

      - name: Compute asset checksums
        id: shas
        run: |
          set -euo pipefail
          linux_sha="$(sha256sum herdr-linux-x86_64/herdr-linux-x86_64 | awk '{print $1}')"
          macos_aarch64_sha="$(sha256sum herdr-macos-aarch64/herdr-macos-aarch64 | awk '{print $1}')"
          macos_x86_64_sha="$(sha256sum herdr-macos-x86_64/herdr-macos-x86_64 | awk '{print $1}')"
          windows_sha="$(sha256sum herdr-windows-x86_64/herdr-windows-x86_64.exe | awk '{print $1}')"
          echo "linux_sha256=${linux_sha}" >> "$GITHUB_OUTPUT"
          echo "macos_aarch64_sha256=${macos_aarch64_sha}" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64_sha256=${macos_x86_64_sha}" >> "$GITHUB_OUTPUT"
          echo "windows_sha256=${windows_sha}" >> "$GITHUB_OUTPUT"

      # NOTE: "protocol" below is hardcoded to the wire protocol version this
      # fork last synced from upstream (see src/protocol/wire.rs::PROTOCOL_VERSION).
      # Bump it here when that constant changes.
      - name: Update latest.json manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          LINUX_SHA: ${{ steps.shas.outputs.linux_sha256 }}
          MACOS_AARCH64_SHA: ${{ steps.shas.outputs.macos_aarch64_sha256 }}
          MACOS_X86_64_SHA: ${{ steps.shas.outputs.macos_x86_64_sha256 }}
          WINDOWS_SHA: ${{ steps.shas.outputs.windows_sha256 }}
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          python3 - "$VERSION" "$BASE_URL" "$LINUX_SHA" "$MACOS_AARCH64_SHA" "$MACOS_X86_64_SHA" "$WINDOWS_SHA" <<'PYEOF'
          import json
          import sys

          version, base_url, linux_sha, macos_aarch64_sha, macos_x86_64_sha, windows_sha = sys.argv[1:7]
          notes = f"See https://github.com/khanhtd36/herdr/releases/tag/fork-v{version} for release notes."
          assets = {
              "linux-x86_64": f"{base_url}/herdr-linux-x86_64",
              "macos-aarch64": f"{base_url}/herdr-macos-aarch64",
              "macos-x86_64": f"{base_url}/herdr-macos-x86_64",
              "windows-x86_64": f"{base_url}/herdr-windows-x86_64.exe",
          }
          sha256 = {
              "linux-x86_64": linux_sha,
              "macos-aarch64": macos_aarch64_sha,
              "macos-x86_64": macos_x86_64_sha,
              "windows-x86_64": windows_sha,
          }
          manifest = {
              "version": version,
              "protocol": 20,
              "notes": notes,
              "assets": assets,
              "sha256": sha256,
              "releases": {
                  version: {
                      "notes": notes,
                      "protocol": 20,
                      "assets": assets,
                      "sha256": sha256,
                  }
              },
          }
          with open("distribution/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit and push manifest update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add distribution/latest.json
          if git diff --cached --quiet; then
            echo "distribution/latest.json unchanged, nothing to commit"
          else
            git commit -m "chore: update latest.json for fork-v${VERSION}"
            git push origin HEAD:master
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's loop-prevention rule), so pages-deploy.yml would
      # never redeploy distribution/latest.json after the commit above. Trigger it
      # explicitly via workflow_dispatch instead.
      - name: Trigger Pages deploy for the updated manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --repo "${GITHUB_REPOSITORY}" --ref master

  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Install wingetcreate
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit winget manifest update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe update khanhtd36.herdr-khanhtd36 `
            --version "${{ needs.release.outputs.version }}" `
            --urls "${{ needs.release.outputs.windows_asset_url }}" `
            --submit `
            --token "$env:WINGET_TOKEN"

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: khanhtd36/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          AARCH64_SHA: ${{ needs.release.outputs.macos_aarch64_sha256 }}
          X86_64_SHA: ${{ needs.release.outputs.macos_x86_64_sha256 }}
        run: |
          set -euo pipefail
          formula=Formula/herdr-khanhtd36.rb
          sed -i \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            -e "s|releases/download/fork-v[^/]*/herdr-macos-aarch64|releases/download/${TAG}/herdr-macos-aarch64|" \
            -e "s|releases/download/fork-v[^/]*/herdr-macos-x86_64|releases/download/${TAG}/herdr-macos-x86_64|" \
            "$formula"
          # Replace the sha256 that follows each url line, matched by
          # arch-specific context since the two shas would otherwise be
          # indistinguishable to a blind substitution.
          awk -v arm="$AARCH64_SHA" -v amd="$X86_64_SHA" '
            /herdr-macos-aarch64"/ { arch = "arm" }
            /herdr-macos-x86_64"/ { arch = "amd" }
            /sha256/ && arch == "arm" { sub(/sha256 ".*"/, "sha256 \"" arm "\""); arch = "" }
            /sha256/ && arch == "amd" { sub(/sha256 ".*"/, "sha256 \"" amd "\""); arch = "" }
            { print }
          ' "$formula" > "$formula.tmp"
          mv "$formula.tmp" "$formula"

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git -c user.name="khanhtd36-bot" -c user.email="khanhtd36@gmail.com" \
            commit -am "Update herdr-khanhtd36 to ${VERSION}"
          git push
